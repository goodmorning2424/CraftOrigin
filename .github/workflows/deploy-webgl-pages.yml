name: Build and deploy Craft-live WebGL

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Free disk space for Unity WebGL
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          docker system prune --all --force
          df -h /

      - name: Restore Unity Library cache
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          artifactsPath: TestResults
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildName: CraftLiveWebGL
          buildsPath: Builds

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          sudo chown -R "$(id -u)":"$(id -g)" Builds/WebGL/CraftLiveWebGL
          touch Builds/WebGL/CraftLiveWebGL/.nojekyll

      - name: Validate WebGL artifact references
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("Builds/WebGL/CraftLiveWebGL")
          index = (root / "index.html").read_text(encoding="utf-8")
          references = re.findall(
              r'buildUrl\s*\+\s*"/([^"?]+)"',
              index,
          )
          if not references:
              raise SystemExit("No WebGL build references found in index.html")
          missing = [name for name in references if not (root / "Build" / name).is_file()]
          if missing:
              raise SystemExit(f"Missing WebGL files referenced by index.html: {missing}")
          wasm = next((root / "Build").glob("*.wasm*"), None)
          if wasm is None or wasm.stat().st_size < 8:
              raise SystemExit("WebAssembly artifact is missing or empty")
          tutorial = root / "OperationGuide.mp4"
          if not tutorial.is_file() or tutorial.stat().st_size < 1024:
              raise SystemExit("Deferred Pad2 tutorial video is missing or empty")
          print(f"Validated {len(references)} build references and {wasm.name}")

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: Builds/WebGL/CraftLiveWebGL

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
