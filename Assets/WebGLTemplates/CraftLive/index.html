<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <main id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <section id="unity-loading" aria-live="polite">
        <div id="unity-title">{{{ PRODUCT_NAME }}}</div>
        <div id="unity-progress-track">
          <div id="unity-progress"></div>
        </div>
        <div id="unity-loading-label">読み込み中</div>
      </section>
      <div id="unity-status" role="status"></div>
    </main>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#unity-loading");
      const progress = document.querySelector("#unity-progress");
      const status = document.querySelector("#unity-status");

      function showStatus(message, kind, persistent) {
        const item = document.createElement("div");
        item.className = "status-item " + (kind || "");
        item.textContent = message;
        status.appendChild(item);
        if (!persistent) {
          window.setTimeout(() => item.remove(), 5000);
        }
      }

      window.addEventListener("offline", () => {
        showStatus(
          "通信が切れています。操作内容は端末内に保留し、復帰後に再送します。",
          "warning",
          false);
      });
      window.addEventListener("online", () => {
        showStatus("通信が復帰しました。", "success", false);
      });
      window.addEventListener("contextmenu", event => event.preventDefault());
      document.addEventListener(
        "touchmove",
        event => event.preventDefault(),
        { passive: false });

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      const config = {
        arguments: [],
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: buildUrl + "/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Avoid allocating oversized color/depth buffers on Retina tablets.
        // Text clarity is handled by the larger generated font atlas instead.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5),
        autoSyncPersistentDataPath: true,
        showBanner: (message, type) => {
          showStatus(message, type, type === "error");
        }
      };

#if BACKGROUND_FILENAME
      canvas.style.background =
        "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, value => {
          progress.style.width = (100 * value) + "%";
        }).then(unityInstance => {
          loading.hidden = true;
          window.craftLiveUnityInstance = unityInstance;
        }).catch(error => {
          loading.hidden = true;
          showStatus(String(error), "error", true);
        });
      };
      script.onerror = () => {
        loading.hidden = true;
        showStatus(
          "ゲームの読み込みに失敗しました。通信と配信設定を確認してください。",
          "error",
          true);
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
