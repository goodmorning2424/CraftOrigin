<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <main id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <section id="unity-loading" aria-live="polite">
        <div id="unity-title">{{{ PRODUCT_NAME }}}</div>
        <div id="unity-progress-track">
          <div id="unity-progress"></div>
        </div>
        <div id="unity-loading-label">読み込み中</div>
      </section>
      <div id="unity-status" role="status"></div>
    </main>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      const loading = document.querySelector("#unity-loading");
      const progress = document.querySelector("#unity-progress");
      const status = document.querySelector("#unity-status");
      const recoveryParameter = "build-refresh";
      const recoveryAttemptParameter = "build-retry";
      const recoveryStorageKey = "craft-live-build-recovery-attempts";
      const maxRecoveryAttempts = 3;
      const isFileProtocol = window.location.protocol === "file:";

      function currentRecoveryAttempts() {
        const urlAttempts = Number.parseInt(
          new URL(window.location.href).searchParams.get(
            recoveryAttemptParameter) || "0",
          10);
        if (Number.isFinite(urlAttempts) && urlAttempts > 0) {
          return urlAttempts;
        }

        try {
          const stored = Number.parseInt(
            window.sessionStorage.getItem(recoveryStorageKey) || "0",
            10);
          return Number.isFinite(stored) ? stored : 0;
        } catch (_) {
          return 0;
        }
      }

      function recordRecoveryAttempt(attempts) {
        try {
          window.sessionStorage.setItem(
            recoveryStorageKey,
            String(attempts));
        } catch (_) {
          // A cache-busted navigation still works when storage is unavailable.
        }
      }

      function clearRecoveryAttempts() {
        try {
          window.sessionStorage.removeItem(recoveryStorageKey);
        } catch (_) {
          // Ignore storage restrictions in private browsing modes.
        }
      }

      function withBuildCacheToken(path) {
        const token = new URL(window.location.href)
          .searchParams.get(recoveryParameter);
        if (!token) {
          return path;
        }

        const url = new URL(path, window.location.href);
        url.searchParams.set(recoveryParameter, token);
        return url.toString();
      }

      function recoverFromStaleBuild(error) {
        const message = String(error || "");
        const isBuildRuntimeFailure =
          /memory access out of bounds|unknown data format|doctype|data format|wasm|failed to fetch|load/i.test(message);
        const currentUrl = new URL(window.location.href);
        const attempts = currentRecoveryAttempts();
        if (!isBuildRuntimeFailure || attempts >= maxRecoveryAttempts) {
          return false;
        }

        recordRecoveryAttempt(attempts + 1);
        currentUrl.searchParams.set(recoveryParameter, Date.now().toString());
        currentUrl.searchParams.set(
          recoveryAttemptParameter,
          String(attempts + 1));
        window.location.replace(currentUrl.toString());
        return true;
      }

      function showStatus(message, kind, persistent) {
        const item = document.createElement("div");
        item.className = "status-item " + (kind || "");
        item.textContent = message;
        status.appendChild(item);
        if (!persistent) {
          window.setTimeout(() => item.remove(), 5000);
        }
      }

      window.addEventListener("offline", () => {
        showStatus(
          "通信が切れています。操作内容は端末内に保留し、復帰後に再送します。",
          "warning",
          false);
      });
      window.addEventListener("online", () => {
        showStatus("通信が復帰しました。", "success", false);
      });
      window.addEventListener("error", event => {
        recoverFromStaleBuild(event.message || event.error);
      });
      window.addEventListener("contextmenu", event => event.preventDefault());
      document.addEventListener(
        "touchmove",
        event => event.preventDefault(),
        { passive: false });

      const buildUrl = "Build";
      const loaderUrl = withBuildCacheToken(
        buildUrl + "/{{{ LOADER_FILENAME }}}");
      const isIPad = /iPad/i.test(navigator.userAgent) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      const config = {
        arguments: [],
        dataUrl: withBuildCacheToken(
          buildUrl + "/{{{ DATA_FILENAME }}}"),
        frameworkUrl: withBuildCacheToken(
          buildUrl + "/{{{ FRAMEWORK_FILENAME }}}"),
#if USE_THREADS
        workerUrl: withBuildCacheToken(
          buildUrl + "/{{{ WORKER_FILENAME }}}"),
#endif
#if USE_WASM
        codeUrl: withBuildCacheToken(
          buildUrl + "/{{{ CODE_FILENAME }}}"),
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: withBuildCacheToken(
          buildUrl + "/{{{ SYMBOLS_FILENAME }}}"),
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Preserve crisp world-space text on Retina iPads while keeping the
        // render buffer bounded and predictable.
        devicePixelRatio: Math.min(
          window.devicePixelRatio || 1,
          isIPad ? 1.35 : 2),
        autoSyncPersistentDataPath: true,
        showBanner: (message, type) => {
          // Unity reports a missing hashed .data file through showBanner as
          // "Unknown data format" after GitHub Pages returns its HTML 404
          // document. Route that path through the same one-time cache-busting
          // recovery used for loader and WebAssembly failures.
          if (type === "error" && recoverFromStaleBuild(message)) {
            return;
          }
          showStatus(message, type, type === "error");
        }
      };

#if BACKGROUND_FILENAME
      canvas.style.background =
        "url('" + buildUrl + "/{{{ BACKGROUND_FILENAME.replace(/'/g, '%27') }}}') center / cover";
#endif

      const script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, value => {
          progress.style.width = (100 * value) + "%";
        }).then(unityInstance => {
          loading.hidden = true;
          window.craftLiveUnityInstance = unityInstance;
          // The marker only prevents a reload loop during this attempt. Once
          // loading succeeds, remove it so a later deployment can recover in
          // the same browser tab as well.
          const loadedUrl = new URL(window.location.href);
          if (loadedUrl.searchParams.has(recoveryParameter)) {
            loadedUrl.searchParams.delete(recoveryParameter);
            loadedUrl.searchParams.delete(recoveryAttemptParameter);
            window.history.replaceState(null, "", loadedUrl.toString());
          }
          clearRecoveryAttempts();
        }).catch(error => {
          loading.hidden = true;
          if (!recoverFromStaleBuild(error)) {
            showStatus(String(error), "error", true);
          }
        });
      };
      script.onerror = () => {
        loading.hidden = true;
        if (!recoverFromStaleBuild("failed to load Unity loader")) {
          showStatus(
            "ゲームの読み込みに失敗しました。通信と配信設定を確認してください。",
            "error",
            true);
        }
      };
      if (isFileProtocol) {
        loading.hidden = true;
        showStatus(
          "このUnity WebGLビルドはHTMLファイルの直接開きでは実行できません。ビルドフォルダー内の「Start-CraftLiveSimulator.cmd」を起動してください。",
          "error",
          true);
      } else {
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
